<form id="letterForm">
    <label>Mittente:</label>
    <input type="text" id="Email" placeholder="Nome e Cognome / Azienda">
    <label>Email:</label>
    <input type="text" id="EmailAddress" placeholder="Indirizzo email">
    <label>Destinatario:</label>
    <input type="text" id="recipient" placeholder="Nome e Cognome / Azienda">
    <label>Email:</label>
    <input type="text" id="Email" placeholder="Email">
    <label>Oggetto:</label>
    <input type="text" id="subject" placeholder="Oggetto della lettera">
    <label>Corpo della lettera:</label>
    <textarea id="body" rows="8" placeholder="Scrivi qui il testo della lettera..."></textarea>
    <label>Firma:</label>
    <input type="text" id="signature" placeholder="Nome e Cognome">
    <button type="button" onclick="downloadPDF()">Formatta e Scarica Documento</button>
</form>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
async function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 25;
    const lineHeight = 7;
    let cursorY = margin;

    const Email = document.getElementById('Email').value;
    const EmailAddress = document.getElementById('EmailAddress').value;
    const recipient = document.getElementById('recipient').value;
    const Email = document.getElementById('Email').value;
    const subject = document.getElementById('subject').value;
    const body = document.getElementById('body').value;
    const signature = document.getElementById('signature').value;

    const today = new Date();
    const date = today.toLocaleDateString('it-IT', {day:'2-digit', month:'long', year:'numeric'});

    doc.setFont("times", "");
    doc.setFontSize(12);

    // Funzione per aggiungere testo con capo automatico e cambio pagina
    function addText(text, x, align='left') {
        const lines = doc.splitTextToSize(text, pageWidth - 2*margin);
        for (let i = 0; i < lines.length; i++) {
            if (cursorY + lineHeight > pageHeight - margin) {
                doc.addPage();
                cursorY = margin;
            }
            doc.text(lines[i], x, cursorY, {align: align});
            cursorY += lineHeight;
        }
    }

    // Mittente in alto a destra
    addText(`${Email}\n${EmailAddress}\n\n${date}`, pageWidth - margin, 'right');
    cursorY += 5;

    // Destinatario a sinistra
    addText(`Alla cortese attenzione di:\n${recipient}\n${Email}\n`, margin);
    cursorY += 5;

    // Oggetto in grassetto
    addText(`Oggetto: ${subject}\n\n`, margin);

    // Corpo lettera
    addText(`Gentile ${recipient.split(' ')[0]},\n\n${body}\n\n`, margin);

    // Chiusura a destra
    addText(`Distinti saluti, Gabriel Jones - 18F`, pageWidth - margin, 'right');

    doc.save('${subject}\n\n.pdf');
}
</script>
