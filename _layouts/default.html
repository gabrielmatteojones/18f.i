<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabriel Jones</title>
<link rel="stylesheet" href="{{ site.url }}/stiligenerali.css">
</head>
<body>

    <!-- BARRA SUPERIORE -->
    <header class="topbar">
        <div class="left-top">
            <span class="name">Gabriel Jones</span>
        </div>

        <div class="right-top"><a href="{{ site.url }}/userlogin/">
            <button class="accesso">ACCESSO</button>
        </a></div>

        <!-- LOGO SOVRAPPOSTO -->
        <img src="{{ site.url }}/assets/logo.png" class="logo" alt="Logo">
    </header>

    <!-- BARRA INFERIORE -->
    <nav class="navmenu">
        <ul class="nav-left">
            <li><a href="/aree/foia/">FOIA</a></li>
            <li><a href="/users/gabrieljones/">ABOUT ME</a></li>
            <li><a href="/contatti/">CONTACT ME</a></li>
        </ul>

        <ul class="nav-right">
            <li><a href="/projects/">Progetti</a></li>
            <li><a href="/portfolio/">Portfolio</a></li>
            <li><a href="/service/">Servizi</a></li>
        </ul>
    </nav>
<section class="hero">
    <div class="hero-content">
        <h1>{{ page.title }}</h1>
    </div>
    <div class="hero-image">
        <img src="/assets/hero-image.png" alt="Hero Image">
    </div>
</section>





<!-- ===== COMPONENTE: CONTAINER GENERICO ===== -->
<div class="container">
{{ content }}
</div>

<style>
.container {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
}

@media (max-width: 1024px) {
    .container {
        padding: 0 15px;
    }
}

@media (max-width: 768px) {
    .container {
        padding: 0 10px;
    }
}

@media (max-width: 480px) {
    .container {
        padding: 0 5px;
    }
}
</style>












    
<!-- FOOTER -->
<footer class="site-footer">
    <div class="footer-container">
        <div class="footer-brand">
            <img src="https://gabrieljones.it/assets/logo.png" alt="Logo">
            <span>Gabriel Jones</span>
        </div>
        <ul class="footer-links">
            <li><a href="/users/gabrieljones/">About Me</a></li>
            <li><a href="/contatti/">Contatti</a></li>
            <li><a href="/projects/">Progetti</a></li>
            <li><a href="/social/">Social</a></li>
        </ul>
        <div class="footer-social">
            <a href="https://instagram.com/gabrieljones_official/"><img src="https://img.icons8.com/ios-filled/30/ffffff/instagram-new.png" alt="Instagram"></a>
        </div>
    </div>
    <div class="footer-bottom">
        &copy; 2025 Gabriel Jones. Tutti i diritti riservati.
    </div>
