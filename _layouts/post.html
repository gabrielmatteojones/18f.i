---
layout: default
---
<article class="container px-2 mx-auto mb4" itemscope itemtype="http://schema.org/BlogPosting">
<div class="mark">
  <mark>
    <h1 class="h0 col-9 sm-width-full py-4 mt-3 inline-block mark" itemprop="name headline">{{ page.title }}</h1>
  </mark>
</div>
  <div class="col-4 sm-width-full mt-1 border-top-thin ">
    <p class="mb-3 py-2 bold h4"><time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%b %-d, %Y" }}</time>   |    Posted By: <b><mark><a href="https://gjws.it/profiles/@gabrieljones/">@GabrielJones</a></mark></b></p>
  </div>

  <div class="prose" itemprop="articleBody">
      {{ content }}
  </div>

</article>

<div class="container mx-auto px-2 py-2 clearfix">
  {% include previous-next.html %}
</div>
<style>
/* Stile per il post */
.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    background: #fff;
}

.mark mark {
    background: #fff200;
    padding: 0 10px;
}

.h0 {
    font-size: 48px;
    color: #2e2587;
    margin-bottom: 20px;
}

.col-4 {
    width: 33%;
}

.sm-width-full {
    width: 100%;
}

.border-top-thin {
    border-top: 2px solid #2e2587;
    padding-top: 10px;
    margin-top: 10px;
}

.bold {
    font-weight: bold;
}

.h4 {
    font-size: 18px;
    color: #333;
}

.prose {
    font-size: 18px;
    line-height: 1.6;
    color: #444;
    margin-top: 30px;
}

.prose p {
    margin-bottom: 20px;
}

.prose img {
    max-width: 100%;
    border-radius: 15px;
    margin: 20px 0;
}

a {
    color: #2e2587;
    text-decoration: none;
    transition: color 0.3s;
}

a:hover {
    color: #fbb034;
}

.clearfix::after {
    content: "";
    display: table;
    clear: both;
}

/* Responsive */
@media (max-width: 768px) {
    .h0 {
        font-size: 36px;
    }
    .prose {
        font-size: 16px;
    }
}

@media (max-width: 480px) {
    .h0 {
        font-size: 28px;
    }
    .prose {
        font-size: 14px;
    }
}
</style>
