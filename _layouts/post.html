---
layout: default
---

<article class="container px-2 mx-auto mb-4" itemscope itemtype="http://schema.org/BlogPosting">
  <!-- Titolo -->
  <header class="mark mb-4">
    <mark>
      <h1 class="h0 col-9 sm-width-full py-4 mt-3 inline-block" itemprop="name headline">
        {{ page.title }}
      </h1>
    </mark>
  </header>

  <!-- Meta informazioni -->
  <div class="col-4 sm-width-full mt-1 border-top-thin">
    <p class="mb-3 py-2 bold h4">
      <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
        {{ page.date | date: "%b %-d, %Y" }}
      </time>
      | Posted By: 
      <b>
        <mark>
          <a href="https://gjws.it/profiles/@gabrieljones/">@GabrielJones</a>
        </mark>
      </b>
    </p>
  </div>

  <!-- Contenuto dell'articolo -->
  <div class="prose" itemprop="articleBody">
    {{ content }}
  </div>
</article>

<!-- Navigazione precedente/successivo -->
<div class="container mx-auto px-2 py-2 clearfix">
  {% include previous-next.html %}
</div>
