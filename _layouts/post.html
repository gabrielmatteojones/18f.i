<main class="pt-32 pb-20 px-6">
  <div class="container mx-auto max-w-3xl">

    <!-- BACK -->
    <a
      href="/giornale"
      class="inline-flex items-center gap-2 text-muted-foreground hover:text-primary transition-colors mb-8"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" class="w-4 h-4">
        <path d="m12 19-7-7 7-7"></path>
        <path d="M19 12H5"></path>
      </svg>
      Back to the journal
    </a>

    <article class="opacity-0 animate-fade-up">

      <!-- HEADER -->
      <header class="mb-12">

        <div class="flex items-center gap-4 mb-4">
          <span class="text-sm font-medium text-primary uppercase tracking-wider">
            {{ page.categories | first }}
          </span>

          <div class="flex items-center gap-1 text-muted-foreground text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" class="w-4 h-4">
              <path d="M8 2v4"></path>
              <path d="M16 2v4"></path>
              <rect width="18" height="18" x="3" y="4" rx="2"></rect>
              <path d="M3 10h18"></path>
            </svg>
            <span>{{ page.date | date: "%B %d, %Y" }}</span>
          </div>
        </div>

        <h1 class="font-display text-3xl md:text-4xl font-bold text-foreground leading-tight mb-6">
          {{ page.title }}
        </h1>

        <div class="flex items-center justify-between border-t border-b border-border py-4">
          <span class="text-muted-foreground text-sm">
              By Gabriel Jones
          </span>

          <button
            type="button"
            class="flex items-center gap-2 text-muted-foreground hover:text-primary transition-colors text-sm"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" class="w-4 h-4">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" x2="15.42" y1="13.51" y2="17.49"></line>
              <line x1="15.41" x2="8.59" y1="6.51" y2="10.49"></line>
            </svg>
            Share
          </button>
        </div>

      </header>

      <!-- CONTENT -->
      <div class="prose prose-invert max-w-none">
        {{ content }}
      </div>

    </article>

    <!-- FOOTER LINK -->
    <div class="mt-16 pt-8 border-t border-border">
      <a
        href="/giornale"
        class="inline-flex items-center gap-2 text-primary hover:underline"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" class="w-4 h-4">
          <path d="m12 19-7-7 7-7"></path>
          <path d="M19 12H5"></path>
        </svg>
        More articles
      </a>
    </div>

  </div>
</main>
